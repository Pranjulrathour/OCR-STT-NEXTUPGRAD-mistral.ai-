services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 8000
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai}
      OCR_MODEL: ${OCR_MODEL:-mistral-ocr-latest}
      STT_MODEL: ${STT_MODEL:-voxtral-mini-latest}
      STT_REALTIME_MODEL: ${STT_REALTIME_MODEL:-voxtral-mini-transcribe-realtime-2602}
      STT_STREAMING_DELAY_MS: ${STT_STREAMING_DELAY_MS:-250}
      STT_REFINE_AFTER_STOP: ${STT_REFINE_AFTER_STOP:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-30}
      SPEECH_TIMEOUT_SECONDS: ${SPEECH_TIMEOUT_SECONDS:-60}
      OCR_BATCH_PAGES: ${OCR_BATCH_PAGES:-20}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-1500}
      OCR_SECONDS_PER_PAGE: ${OCR_SECONDS_PER_PAGE:-15}
      OCR_BATCH_TIMEOUT_FLOOR_SECONDS: ${OCR_BATCH_TIMEOUT_FLOOR_SECONDS:-60}
      OCR_BATCH_CONCURRENCY: ${OCR_BATCH_CONCURRENCY:-4}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-10}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-mistral-embed}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-mistral-small-latest}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1200}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-200}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-32}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.35}
      RAG_EMBEDDING_TIMEOUT_SECONDS: ${RAG_EMBEDDING_TIMEOUT_SECONDS:-120}
      RAG_CHAT_TIMEOUT_SECONDS: ${RAG_CHAT_TIMEOUT_SECONDS:-90}
      RAG_INDEX_DIR: ${RAG_INDEX_DIR:-data/rag}
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
